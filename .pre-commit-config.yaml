# `pre-commit install` installs both hook types, so conventional-pre-commit
# (a commit-msg hook) checks commit messages without a separate -t commit-msg.
default_install_hook_types: [pre-commit, commit-msg]
# Hooks without their own stages run only at pre-commit, not again at
# commit-msg.
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
        name: Enforce end of file format

      - id: trailing-whitespace
        name: Enforce removal of trailing whitespace

      - id: mixed-line-ending
        args: [--fix=lf]

      - id: fix-byte-order-marker

      - id: check-yaml
        # Rails fixtures use ERB inside YAML for dynamic values (e.g. dates),
        # which isn't valid plain YAML.
        exclude: ^test/fixtures/

  # Run the rubocop and plugin versions from Gemfile.lock (kept current by
  # Dependabot) instead of a separate copy that would drift from them.
  - repo: local
    hooks:
      - id: rubocop
        name: rubocop
        entry: bundle exec rubocop --force-exclusion
        language: system
        types: [ruby]

  # The hook installs the prettier version matching its rev, so Dependabot's
  # rev bumps upgrade prettier itself. No additional_dependencies: a second
  # pin there would override it and drift.
  - repo: https://github.com/JoC0de/pre-commit-prettier
    rev: v3.9.8
    hooks:
      - id: prettier
        files: \.ya?ml$

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
