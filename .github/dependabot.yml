version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
    cooldown:
      default-days: 7

  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
    cooldown:
      default-days: 7

  # Each gemfiles/ entry in the test matrix has its own directory with a
  # plain Gemfile, the only name Dependabot's bundler support reads.
  - package-ecosystem: "bundler"
    directories:
      - "/"
      - "/gemfiles/activemodel_7_2"
      - "/gemfiles/activemodel_8_0"
    schedule:
      interval: "weekly"
      day: "sunday"
    cooldown:
      default-days: 7
