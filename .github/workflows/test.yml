name: Tests

on:
  # Runs on main save a gem cache there that new pull requests can restore.
  push:
    branches: [main]
  pull_request:
  merge_group:
  # The release workflow runs this whole matrix before publishing.
  workflow_call:

permissions:
  contents: read

# A new push to a pull request cancels its previous run. Runs on main always
# finish, so each merge is tested and its cache saved.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Tests (Ruby ${{ matrix.ruby }}, ${{ matrix.gemfile }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.4", "4.0"]
        # Gemfile tests the newest activemodel; the others test each older
        # minor series the gemspec allows (7.2 and 8.0), at its latest patch
        # release, not the .0 release.
        gemfile:
          - Gemfile
          - gemfiles/activemodel_8_0.gemfile
          - gemfiles/activemodel_7_2.gemfile

    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/${{ matrix.gemfile }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1.324.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Run tests
        run: bundle exec rake test

  # The single check the main branch ruleset requires, so the matrix above can
  # change without editing the ruleset. It reports even when a test job fails.
  tests-passed:
    name: Tests passed
    if: always()
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Check that every test job passed
        run: test "${{ needs.test.result }}" = success
