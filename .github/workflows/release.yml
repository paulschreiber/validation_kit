name: Release

# Publishes the version in lib/validation_kit/version.rb to RubyGems.org with
# trusted publishing (no API key). After bumping the version on main, publish a
# GitHub Release with the tag v<version> on main. The tag then already exists,
# so `rake release` skips its tag and branch pushes and only builds and pushes
# the gem; the job doesn't need write access to the repository.
on:
  release:
    types: [published]

permissions:
  contents: read

# Never run two releases at once.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # The full test matrix (every Ruby and activemodel version the gemspec
  # supports) and lint, on the commit being released.
  tests:
    name: Tests
    if: github.repository == 'paulschreiber/validation_kit' && startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  lint:
    name: Lint
    if: github.repository == 'paulschreiber/validation_kit' && startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/lint.yml
    permissions:
      contents: read

  release:
    name: Release to RubyGems.org
    needs: [tests, lint]
    # Only release v* tags in this repository, not forks. The release
    # environment only allows v* tags, and a tag ruleset limits who can make
    # them.
    if: github.repository == 'paulschreiber/validation_kit' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Must match the environment in the RubyGems.org trusted publisher.
    environment: release

    permissions:
      contents: read # the tag already exists, so nothing is pushed
      id-token: write # trusted publishing to RubyGems.org

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1.324.0
        with:
          bundler-cache: true

      - name: Release gem
        uses: rubygems/release-gem@7f9650160c1a4e7989fdc9855807bdbd421d8b6b # v1.4.1
