name: Release

# Publishes the version in lib/validation_kit/version.rb to RubyGems.org with
# trusted publishing (no API key). Run it manually from the Actions tab after
# bumping the version on main. `rake release` builds the gem, tags the commit
# (v<version>), pushes the tag, and pushes the gem.
on:
  workflow_dispatch:

permissions:
  contents: read

# Never run two releases at once.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # The full test matrix (every Ruby and activemodel version the gemspec
  # supports) on the commit being released, not just one Ruby.
  tests:
    name: Tests
    if: github.repository == 'paulschreiber/validation_kit' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  release:
    name: Release to RubyGems.org
    needs: tests
    # Only release from main in this repository, not from forks or branches.
    if: github.repository == 'paulschreiber/validation_kit' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Must match the environment in the RubyGems.org trusted publisher.
    environment: release

    permissions:
      contents: write # rake release pushes the version tag
      id-token: write # trusted publishing to RubyGems.org

    steps:
      # Release exactly the commit this run is for: the one the tests above ran
      # on and the approval was for. `rake release` pushes main at this
      # commit, so if main has moved since (e.g. a merge during the approval
      # wait), that push would be rejected after tagging locally. Stop first.
      - name: Check main hasn't moved
        run: |
          remote_main=$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | cut -f1)
          if [ "$remote_main" != "$GITHUB_SHA" ]; then
            echo "::error::main is at ${remote_main}, but this release run is for ${GITHUB_SHA}. Review the new commits, then start a new release from main."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1.324.0
        with:
          ruby-version: "4.0"
          bundler-cache: true

      - name: Release gem
        uses: rubygems/release-gem@7f9650160c1a4e7989fdc9855807bdbd421d8b6b # v1.4.1
