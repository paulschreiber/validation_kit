plugins:
  - rubocop-minitest
  - rubocop-performance
  - rubocop-rake

AllCops:
  NewCops: enable
  # Oldest Ruby the gem supports; matches required_ruby_version and the CI matrix.
  TargetRubyVersion: 3.4
  Exclude:
    - "Gemfile.lock"
    - "pkg/**/*"
    - "vendor/**/*"

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

Style/Documentation:
  Enabled: false

Layout/LineLength:
  Exclude:
    # EMAIL_ADDRESS_RE is a single ~1,000-character regex.
    - "lib/validation_kit/email_validator/email_validator.rb"

Metrics/AbcSize:
  Enabled: false
Metrics/CyclomaticComplexity:
  Enabled: false
Metrics/PerceivedComplexity:
  Enabled: false
Metrics/MethodLength:
  Enabled: false
Metrics/BlockLength:
  Exclude:
    - "test/**/*"

# Plain %s tokens are clearer than %<name>s for these short phone/postcode formats.
Style/FormatString:
  Enabled: false
Style/FormatStringToken:
  Enabled: false
